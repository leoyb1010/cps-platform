name: CI

on:
  push:
    branches: [main, codex/audit-cps-platform-20261001, audit/five-round-product-20261004]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端 (build + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript 严格检查
        # 类型开关单一来源于 tsconfig.app.json，不在命令行覆盖（原 --noUnusedLocals 与本地 tsconfig 不一致）
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: 单元测试 (Vitest)
        run: npm test
      - name: 生产构建
        run: npm run build

  lint:
    name: 代码规范 (ESLint · 前端)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  server:
    name: 后端 (build + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Schema 同步校验 (sqlite ↔ postgres)
        run: sh scripts/check-schema-sync.sh
      - name: Prisma 生成 + 建表 (sqlite)
        run: npx prisma generate && npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./dev.db
          PRISMA_HIDE_UPDATE_MESSAGE: "1"
          RUST_LOG: info
      - name: 构建
        run: npm run build
      - name: e2e (独立 test.db, 自建+灌种子)
        run: npm test
        env:
          NODE_ENV: test
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/test-offline.cjs
          JWT_ACCESS_SECRET: ci-access-secret-not-for-prod-xxxxx
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod-xxxxx

  pg-schema:
    name: PostgreSQL schema 校验
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 校验 PG schema 合法
        run: npx prisma validate --schema prisma/schema.postgres.prisma
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db

  product-pg-upgrade:
    name: Product identity PostgreSQL upgrade and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: audit, POSTGRES_PASSWORD: synthetic-local-audit-password, POSTGRES_DB: audit }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:synthetic-local-audit-password@127.0.0.1:5432/audit
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci && npx prisma generate --schema prisma/schema.postgres.prisma
      - name: Upgrade a populated legacy schema without rewriting products
        run: |
          set -euo pipefail
          for migration in prisma/migrations-pg/[0-6]_*/migration.sql; do npx prisma db execute --schema prisma/schema.postgres.prisma --file "$migration"; done
          cat <<'SQL' | npx prisma db execute --schema prisma/schema.postgres.prisma --stdin
          INSERT INTO "Brand" ("id","name","mark","category","feeRate","period","reservePct","joinedAt") VALUES ('synthetic-migration-brand','Synthetic brand','S','tools',0,30,0,'2026-10-04');
          INSERT INTO "Product" ("id","brandId","name","firstPrice","renewPrice") VALUES ('legacy-1','synthetic-migration-brand','Legacy one',9900,9900),('legacy-2','synthetic-migration-brand','Legacy two',9900,9900);
          INSERT INTO "Product" ("id","brandId","name","deletedAt") VALUES ('legacy-3','synthetic-migration-brand','Legacy deleted',CURRENT_TIMESTAMP);
          SQL
          npx prisma db execute --schema prisma/schema.postgres.prisma --file prisma/migrations-pg/7_product_creation_identity/migration.sql
          node scripts/audit-product-pg.cjs

  e2e:
    name: 端到端 (Playwright · 真实浏览器)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E (mock 模式, webServer 自动起前端)
        run: npm run test:e2e
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            /tmp/cps-ui-audit/
          retention-days: 7

  role-journeys:
    name: Additional role rounds (real API + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: file:/tmp/cps-role-ui.db
      JWT_ACCESS_SECRET: role-ui-local-fixture-access-xxxxxxxx
      JWT_REFRESH_SECRET: role-ui-local-fixture-refresh-xxxxxxx
      AUDIT_ROUND: '3'
      AIGC_INTERNAL_SECRET: synthetic-role-sidecar-signing-fixture-only
      AIGC_SERVICE_URL: http://127.0.0.1:48787
      AGENT_STUDIO_DATA_DIR: /tmp/cps-role-studio-data
      AGENT_STUDIO_EXPORTS_DIR: /tmp/cps-role-studio-exports
      CREATIVE_TEXT_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
      IMAGE_GENERATION_API: ''
      VIDEO_RENDER_API: ''
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm ci && npm ci --prefix server && npm ci --prefix services/agent-studio
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Prepare disposable synthetic backend
        working-directory: server
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed
          npm run build
      - name: Run real role journeys and cross-account handoff
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/test-offline.cjs
        run: |
          set -euo pipefail
          (cd services/agent-studio && PORT=48787 FRONTEND_PORT=48787 HOST=127.0.0.1 BFF_HOST=127.0.0.1 SERVE_STATIC=false node server/src/index.js) > /tmp/cps-role-studio.log 2>&1 &
          studio_pid=$!
          (cd server && node dist/src/main.js) > /tmp/cps-role-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready >/dev/null && curl -fsS http://127.0.0.1:48787/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-round2-integration.mjs
          kill "$studio_pid"; wait "$studio_pid" || true
          (cd services/agent-studio && PORT=48787 FRONTEND_PORT=48787 HOST=127.0.0.1 BFF_HOST=127.0.0.1 SERVE_STATIC=false node server/src/index.js) >> /tmp/cps-role-studio.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:48787/api/health >/dev/null; then break; fi; sleep 1; done
          node scripts/audit-round2-integration.mjs --read-after-restart
          npx playwright test --config playwright.roles.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cps-role-journeys-${{ github.sha }}
          path: |
            /tmp/cps-role-ui-audit/
            /tmp/cps-role-server.log
            /tmp/cps-role-studio.log
            /tmp/cps-role-studio-exports/
            test-results/
          retention-days: 14

  security-audit:
    name: 依赖漏洞扫描 (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      # 前端无 high 漏洞 → 阻断
      - name: 前端依赖审计（high 阻断）
        run: npm audit --audit-level=high
      # 后端已清零已知漏洞，新增 moderate+ 一律阻断，避免资金/权限链路带病进入 main。
      - name: 后端依赖审计（moderate 阻断）
        working-directory: server
        run: npm audit --audit-level=moderate

  docker-smoke:
    name: Docker 冒烟 (compose build + up + /health · PostgreSQL 运行时)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # compose 的 :? 必填 env 需在所有 compose 调用步骤都可见 → 统一写入 GITHUB_ENV。
      # YOUDAO 私钥必须是"非仓库 demo"的真实 RSA，否则 main.ts assertSecrets 拒启 → 现场生成一次性密钥。
      - name: 准备一次性生产 env
        run: |
          {
            echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.pg.yml'
            echo 'JWT_ACCESS_SECRET=ci-access-secret-not-for-prod-000000000000'
            echo 'JWT_REFRESH_SECRET=ci-refresh-secret-not-for-prod-00000000000'
            echo 'POSTGRES_PASSWORD=ci_pg_password_change_me'
            # compose 对 METRICS_TOKEN 是 :? 必填（main.ts 生产拒启 <16 字符）——缺它 compose up 直接报错，
            # 此前 docker-smoke 连红即因此。
            echo 'METRICS_TOKEN=ci-metrics-token-not-for-prod-0000'
            echo 'YOUDAO_PLATFORM_PRIVATE_KEY<<PEM_EOF'
            openssl genrsa 2048 2>/dev/null
            echo 'PEM_EOF'
          } >> "$GITHUB_ENV"
      - name: 构建并起栈（默认 SQLite + PG 叠加层 → 服务端跑在 PostgreSQL 上）
        run: docker compose up -d --build
      - name: 等待 server 就绪并冒烟 /ready
        run: |
          sid=$(docker compose ps -q server)
          for i in $(seq 1 40); do
            st=$(docker inspect -f '{{.State.Health.Status}}' "$sid" 2>/dev/null || echo starting)
            echo "server health: $st ($i/40)"
            [ "$st" = healthy ] && break
            [ "$st" = unhealthy ] && { echo 'server 变为 unhealthy'; exit 1; }
            sleep 5
          done
          # 经 nginx(/api → server:3001) 打就绪探针（含 DB）；同时校验前端根可达
          curl -fsS http://localhost:8080/api/ready
          curl -fsS -o /dev/null http://localhost:8080/
      - name: 失败时打印容器日志
        if: failure()
        run: docker compose logs --tail=120
      - name: 拆栈
        if: always()
        run: docker compose down -v

  studio:
    name: Agent Studio isolated tests video and UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/agent-studio
    env:
      NODE_ENV: test
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      AGENT_STUDIO_DATA_DIR: /tmp/cps-studio-audit-data
      AGENT_STUDIO_EXPORTS_DIR: /tmp/cps-studio-audit-exports
      AIGC_INTERNAL_SECRET: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/agent-studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Full suite including real local video rendering
        run: npm test -- --maxWorkers=1
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/test-offline.cjs
      - run: npm run build && npm audit --audit-level=low
      - name: Start disposable Studio and capture UI
        run: |
          PORT=48787 FRONTEND_PORT=48787 node server/src/index.js > /tmp/cps-studio-server.log 2>&1 &
          FRONTEND_PORT=45173 VITE_API_PROXY_TARGET=http://127.0.0.1:48787 npm run dev > /tmp/cps-studio-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:45173/ >/dev/null && curl -fsS http://127.0.0.1:48787/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cps-studio-audit-${{ github.sha }}
          path: |
            /tmp/cps-studio-ui-audit/
            /tmp/cps-studio-server.log
            /tmp/cps-studio-web.log
          retention-days: 14
