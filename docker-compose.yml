# 网易有道 CPS 平台 — 一键启动（后端 NestJS + 前端 Nginx）
# 用法：  docker compose up --build       → 打开 http://localhost:8080

# 日志轮转：默认 json-file 无上限，长跑会撑爆磁盘 → 统一限 10m×3
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/prod.db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET 必填：openssl rand -hex 32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET 必填：openssl rand -hex 32}
      # 有道出站回调平台私钥：缺失则 compose 直接报错，避免回退 demo 私钥被伪造回调后 crash-loop
      YOUDAO_PLATFORM_PRIVATE_KEY: ${YOUDAO_PLATFORM_PRIVATE_KEY:?生产必须提供真实RSA私钥（PEM）：openssl genrsa 2048}
      # /metrics 暴露资金业务指标：缺失则服务拒启（仅靠 nginx 拦截挡不住绕过网关直连容器端口）
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN 必填（≥16 字符）：openssl rand -hex 16}
      ACCESS_TTL: 900s
      REFRESH_TTL_DAYS: "14"
      PORT: "3001"
      # 经 nginx /api 反代，cookie 走根路径
      REFRESH_COOKIE_PATH: /
      # 浏览器实际访问的是 web 容器同源；公网部署时通过 env 加入正式 HTTPS 域名。
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5273}
      # 公网演示环境可显式灌入 demo 数据；正式生产默认关闭。
      # SEED_DEMO=true 时 seed.ts 强制要求 SEED_DEMO_PASSWORD（≥12 字符，非 "demo"），
      # 由 scripts/prepare-deploy-env.sh 随机生成——公网预览域名上不再出现 admin/demo。
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    volumes:
      - cps-db:/data
    healthcheck:
      # readiness：不只证明进程存活，还必须证明 DB 可访问。
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    mem_limit: 512m
    restart: unless-stopped

  web:
    build: .
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 默认仅绑定回环地址，公网入口交给反向代理 / Cloudflare Tunnel。
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    # nginx-unprivileged 监听 8080；busybox wget 探活根路径
    healthcheck:
      # Alpine 可能把 localhost 优先解析到 ::1，而 nginx 当前监听 IPv4。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    mem_limit: 128m
    restart: unless-stopped

volumes:
  cps-db:
